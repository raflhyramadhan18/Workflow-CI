name: CI MLflow & Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up job
        run: echo "Memulai proses CI/CD"

      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas scikit-learn

      - name: Run mlflow project
        # Menggunakan env-manager=local agar CI berjalan cepat tanpa harus menginstal sistem Conda yang berat di runner
        run: mlflow run MLProject/ --env-manager=local

      - name: Get latest MLflow run_id
        id: get_run
        run: |
          RUN_ID=$(python get_run_id.py)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Run ID yang didapatkan: $RUN_ID"

      - name: Install Python dependencies
        run: echo "Dependencies tambahan sudah diinstal pada tahap sebelumnya"

      - name: Upload to GitHub (Menyimpan Artefak)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # Meminta MLflow mencarikan dan mengunduh modelnya langsung
          mlflow artifacts download -u "runs:/$RUN_ID/model" -d saved_artifacts/
          git add saved_artifacts/
          git commit -m "Auto-update: Simpan artefak model terbaru [skip ci]" || echo "Tidak ada perubahan"
          git push

      - name: Build Docker Model
        run: |
          mlflow models build-docker -m "runs:/$RUN_ID/model" -n my-telco-model:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag my-telco-model:latest ${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-model:v1

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-model:v1

      - name: Complete job
        run: echo "Workflow CI selesai dan Docker Image berhasil dipublikasikan!"